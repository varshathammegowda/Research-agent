services:
  backend:
    build:
      context: ./backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the project root .env file}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      - ./backend/data/chroma:/app/data/chroma
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend